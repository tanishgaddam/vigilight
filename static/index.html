<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigiLight Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060910;--surface:#0d1320;--surface2:#131c2e;--line:rgba(148,163,184,.16);--line-strong:rgba(34,211,238,.35);
  --accent:#22d3ee;--ok:#34d399;--warn:#fbbf24;--danger:#f43f5e;--text:#e6edf5;--muted:#8b97ab;
  --radius:10px;--mono:'Share Tech Mono',ui-monospace,monospace;--head:'Orbitron',system-ui,sans-serif;--body:'Rajdhani',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{height:100%}
body{min-height:100%;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#14233b 0%,transparent 60%),linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.35;padding-bottom:44px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:16px;height:16px;flex:none}

/* ---------- top bar ---------- */
.banner{background:var(--danger);color:#fff;text-align:center;padding:6px;font-family:var(--mono);font-size:13px;position:sticky;top:0;z-index:60}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(6,9,16,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo-mark{width:34px;height:34px;border-radius:9px;background:conic-gradient(from 210deg,var(--accent),#2563eb,var(--accent));position:relative;box-shadow:0 0 18px rgba(34,211,238,.35)}
.logo-mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}
.brand-name{font-family:var(--head);font-weight:800;letter-spacing:3px;font-size:19px;color:var(--accent);text-shadow:0 0 12px rgba(34,211,238,.35)}
.brand-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.stats{display:flex;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 16px;min-width:112px}
.stat-val{display:block;font-family:var(--head);font-size:20px;font-weight:600}
.stat-lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat.hot{border-color:var(--danger);box-shadow:0 0 14px rgba(244,63,94,.35)}.stat.hot .stat-val{color:var(--danger)}
.stat.amber .stat-val{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--line-strong);background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04202a}
.btn.primary:hover{background:#67e8f9}
.btn.danger{border-color:rgba(244,63,94,.5);color:#fda4af}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding:20px 22px;align-items:start}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.stats{order:3;width:100%}.stat{flex:1;min-width:0}}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
h2{font-family:var(--head);font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--text)}
h2 small{font-family:var(--mono);letter-spacing:0;color:var(--muted);font-size:12px;margin-left:8px;text-transform:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface2);color:var(--accent)}

/* ---------- cameras ---------- */
.camera-grid{display:grid;grid-template-columns:repeat(var(--cols,auto-fill),minmax(0,1fr));gap:16px}
.camera-grid.auto{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
@media(max-width:700px){.camera-grid,.camera-grid.auto{grid-template-columns:1fr}}
.cam{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;transition:border-color .2s,box-shadow .2s}
.cam.lv-warning{border-color:rgba(251,191,36,.6)}
.cam.lv-threat{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger),0 0 26px rgba(244,63,94,.45)}
.cam-head{display:flex;align-items:center;gap:10px;padding:9px 12px}
.cam-name{font-weight:700;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam-kind{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;text-transform:uppercase}
.cam-head .sp{flex:1}
.chip{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-normal{color:var(--ok)}.c-watch{color:#facc15}.c-warning{color:var(--warn)}.c-threat{color:var(--danger)}.c-threat::before{animation:pulse 1s infinite}.c-off{color:var(--muted)}
@keyframes pulse{50%{opacity:.25}}
.view{position:relative;background:#000;aspect-ratio:16/9}
.view img{width:100%;height:100%;object-fit:contain;display:block}
.view .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(6,9,16,.78);font-family:var(--mono);font-size:13px;color:var(--muted)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.cam:hover .tools,.cam:focus-within .tools{opacity:1}
@media(hover:none){.tools{opacity:1}}
.tool{width:30px;height:30px;display:grid;place-items:center;background:rgba(6,9,16,.78);border:1px solid var(--line);border-radius:7px;color:var(--text)}
.tool:hover{border-color:var(--line-strong);color:var(--accent)}
.tool.rm:hover{color:var(--danger);border-color:var(--danger)}
.cam-foot{padding:10px 12px 12px;display:grid;gap:9px}
.meter{position:relative;height:7px;background:#0a101b;border-radius:4px;overflow:visible}
.meter i{display:block;height:100%;width:0;border-radius:4px;background:var(--ok);transition:width .35s,background .35s}
.meter b{position:absolute;top:-3px;width:2px;height:13px;background:rgba(255,255,255,.35)}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.fact{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:#0a101b;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.fact strong{color:var(--text);font-weight:400}
.fact.bad{color:#fda4af;border-color:rgba(244,63,94,.4)}
.empty-cams{grid-column:1/-1;border:1px dashed var(--line-strong);border-radius:var(--radius);padding:44px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}
.empty-cams strong{color:var(--text);font-family:var(--head);letter-spacing:1px}

/* ---------- incident log ---------- */
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:sticky;top:96px;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
@media(max-width:1100px){.log{position:static;max-height:none}}
.log-head{padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:transparent;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:14px;color:var(--muted)}
.pill[aria-pressed=true]{color:var(--accent);border-color:var(--line-strong);background:rgba(34,211,238,.08)}
.log-row{display:flex;gap:8px}
select,input{background:#0a101b;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
select{width:auto;flex:1}
.feed{overflow-y:auto;padding:12px;display:grid;gap:10px;align-content:start;min-height:120px}
.alert{background:#0a101b;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;display:grid;gap:7px}
.alert.CRITICAL{border-left-color:var(--danger)}.alert.WARNING{border-left-color:#475569}
.alert.acked{opacity:.55}
.a-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.a-type{font-weight:700;letter-spacing:.5px}
.a-time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.a-msg{font-size:15.5px}
.a-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.a-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{border:1px solid var(--line);border-radius:6px;padding:0;background:none;overflow:hidden;width:112px;height:63px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tag.sev-CRITICAL{color:var(--danger);border-color:rgba(244,63,94,.5)}.tag.sev-HIGH{color:var(--warn);border-color:rgba(251,191,36,.5)}
.empty{color:var(--muted);font-family:var(--mono);font-size:13px;padding:22px 6px;text-align:center}

/* ---------- footer ---------- */
.status-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#03050a;border-top:1px solid var(--line);padding:7px 22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ch{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
.ch::before{content:"";width:7px;height:7px;border-radius:50%;background:#475569}
.ch.on{color:var(--text)}.ch.on::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.status-bar .sp{flex:1}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(2,4,8,.78);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet.wide{width:min(980px,100%)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-body{padding:18px;display:grid;gap:16px}
.x{background:none;border:0;color:var(--muted);padding:4px;border-radius:6px}.x:hover{color:var(--text)}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.type{text-align:left;background:#0a101b;border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:2px}
.type strong{font-weight:700}.type span{font-size:13.5px;color:var(--muted)}
.type[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:rgba(34,211,238,.07)}
.field{display:grid;gap:5px;font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two,.types{grid-template-columns:1fr}}
.hint{font-size:13.5px;color:var(--muted);min-height:18px}.hint.err{color:#fda4af}
.usb-list{display:flex;gap:6px;flex-wrap:wrap}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.focus{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:0}
@media(max-width:820px){.focus{grid-template-columns:1fr}}
.focus .view{aspect-ratio:auto;min-height:260px}
.focus-side{padding:16px;display:grid;gap:12px;align-content:start;border-left:1px solid var(--line)}
.kv{display:grid;gap:2px}.kv span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.kv b{font-weight:600;word-break:break-all}
.inc img,.inc video{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:#000}
.reasons{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- alarm overlay ---------- */
.alarm{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(95,0,15,.9);animation:flash 1s infinite}
@keyframes flash{50%{background:rgba(160,0,30,.94)}}
.alarm-box{background:#14060a;border:2px solid var(--danger);border-radius:14px;padding:26px;width:min(660px,100%);text-align:center;display:grid;gap:12px;box-shadow:0 0 60px rgba(244,63,94,.5)}
.alarm-kicker{font-family:var(--mono);color:#fda4af;letter-spacing:3px;font-size:13px}
.alarm-type{font-family:var(--head);font-weight:800;font-size:30px;color:#fff;letter-spacing:2px}
.alarm-msg{font-size:20px}.alarm-why{color:#fda4af;font-size:15px}
.alarm-box img{width:100%;border-radius:8px;border:1px solid var(--danger)}
.alarm-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.alarm-actions .btn{font-size:17px;padding:11px 20px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:56px;z-index:120;display:grid;gap:8px;justify-items:end}
.toast{background:var(--surface2);border:1px solid var(--line-strong);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:in .2s}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--ok)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="banner" id="banner" hidden>Lost connection to the VigiLight server. Retrying...</div>

<header class="top">
  <div class="brand"><span class="logo-mark" aria-hidden="true"></span>
    <div><div class="brand-name">VIGILIGHT</div><div class="brand-sub">Command Center</div></div></div>
  <div class="stats" aria-live="polite">
    <div class="stat" id="stCams"><span class="stat-val" id="statCams">0/0</span><span class="stat-lbl">Cameras online</span></div>
    <div class="stat" id="stThreat"><span class="stat-val" id="statThreat">0</span><span class="stat-lbl">Active threats</span></div>
    <div class="stat" id="stOpen"><span class="stat-val" id="statOpen">0</span><span class="stat-lbl">Open alerts</span></div>
  </div>
  <div class="actions">
    <button class="btn" id="soundBtn" aria-pressed="false"><span id="soundIcon"></span><span id="soundLbl">Sound off</span></button>
    <button class="btn danger" id="testBtn">Test alert</button>
    <button class="btn" id="demoBtn">▶ Demo</button>
    <button class="btn" id="guardBtn">📱 Guard view</button>
    <button class="btn primary" id="addOpen"><span id="plusIcon"></span>Add camera</button>
  </div>
</header>

<!-- demo scenario bar (shown only when demo is active) -->
<div id="demoBar" hidden style="background:rgba(34,211,238,.08);border-bottom:1px solid rgba(34,211,238,.35);padding:10px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--accent)">
  <span style="font-weight:700;letter-spacing:1px">DEMO MODE</span>
  <span style="color:var(--muted)">Trigger a scenario:</span>
  <span id="scenarioBtns" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <button class="btn small" id="demoStop" style="margin-left:auto;color:#fda4af;border-color:rgba(244,63,94,.5)">Stop demo</button>
</div>

<main class="layout">
  <section aria-label="Cameras">
    <div class="section-head">
      <h2>Live cameras<small id="camCount"></small></h2>
      <div class="seg" role="group" aria-label="Grid layout">
        <button data-cols="auto" aria-pressed="true">Auto</button><button data-cols="1" aria-pressed="false">1</button>
        <button data-cols="2" aria-pressed="false">2</button><button data-cols="3" aria-pressed="false">3</button>
      </div>
    </div>
    <div class="camera-grid auto" id="grid"></div>
  </section>

  <aside class="log" aria-label="Incident log">
    <div class="log-head">
      <div class="section-head" style="margin:0"><h2>Incident log<small id="logCount"></small></h2>
        <button class="btn small" id="ackAll">Acknowledge all</button></div>
      <div class="filters" role="group" aria-label="Severity filter">
        <button class="pill" data-sev="all" aria-pressed="true">All</button>
        <button class="pill" data-sev="open" aria-pressed="false">Open</button>
        <button class="pill" data-sev="CRITICAL" aria-pressed="false">Critical</button>
        <button class="pill" data-sev="HIGH" aria-pressed="false">High</button>
      </div>
      <div class="log-row"><select id="camFilter" aria-label="Filter by camera"><option value="all">All cameras</option></select></div>
    </div>
    <div class="feed" id="feed"></div>
  </aside>
</main>

<footer class="status-bar">
  <span>ALERT CHANNELS</span><span id="channels" style="display:flex;gap:14px;flex-wrap:wrap"></span>
  <span class="sp"></span><span id="thresholds"></span>
</footer>

<!-- add camera -->
<div class="modal" id="addModal" hidden role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="addTitle">Add camera</h2><button class="x" data-close aria-label="Close"><span class="ic" data-i="close"></span></button></div>
    <div class="sheet-body">
      <div class="types" id="types" role="group" aria-label="Camera type">
        <button class="type" data-type="usb" aria-pressed="false"><strong>USB webcam</strong><span>Plugged into this computer</span></button>
        <button class="type" data-type="ip" aria-pressed="true"><strong>IP / phone camera</strong><span>IP Webcam app, ESP32-CAM, MJPEG</span></button>
        <button class="type" data-type="rtsp" aria-pressed="false"><strong>RTSP stream</strong><span>CCTV and network cameras</span></button>
        <button class="type" data-type="file" aria-pressed="false"><strong>Video file</strong><span>Recorded clip, loops (demo)</span></button>
      </div>
      <label class="field">Source<input id="addValue" autocomplete="off" spellcheck="false"></label>
      <div id="usbBox" hidden><div class="usb-list" id="usbList"></div></div>
      <div class="two">
        <label class="field">Name (optional)<input id="addName" placeholder="main_streetlight" autocomplete="off"></label>
        <label class="field">Audio<select id="addAudio" style="width:100%">
          <option value="auto">IP camera microphone</option><option value="mic">Local microphone</option><option value="off">Off</option></select></label>
      </div>
      <div class="hint" id="addHint"></div>
    </div>
    <div class="sheet-foot"><button class="btn" id="scanBtn">Scan USB</button><span style="flex:1"></span>
      <button class="btn" data-close>Cancel</button><button class="btn primary" id="addBtn">Add camera</button></div>
  </div>
</div>

<!-- focus view -->
<div class="modal" id="focusModal" hidden role="dialog" aria-modal="true" aria-labelledby="focusTitle">
  <div class="sheet wide">
    <div class="sheet-head"><h2 id="focusTitle"></h2><button class="x" data-close aria-label="Close"><span class="ic" data-i="close"></span></button></div>
    <div class="focus"><div class="view" id="focusView"></div><div class="focus-side" id="focusSide"></div></div>
  </div>
</div>

<!-- incident detail -->
<div class="modal" id="incModal" hidden role="dialog" aria-modal="true" aria-labelledby="incTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="incTitle"></h2><button class="x" data-close aria-label="Close"><span class="ic" data-i="close"></span></button></div>
    <div class="sheet-body inc" id="incBody"></div>
  </div>
</div>

<!-- alarm -->
<div class="alarm" id="alarm" hidden role="alertdialog" aria-live="assertive" aria-labelledby="alType">
  <div class="alarm-box">
    <div class="alarm-kicker">INCIDENT DETECTED</div>
    <div class="alarm-type" id="alType"></div>
    <div class="alarm-msg" id="alMsg"></div>
    <div class="alarm-why" id="alWhy"></div>
    <img id="alImg" alt="Snapshot of the incident" hidden>
    <div class="alarm-actions"><button class="btn danger" id="alAck">Acknowledge and silence</button><button class="btn" id="alView">View incident</button></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const ICONS = {
  plus: 'M12 5v14M5 12h14', close: 'M6 6l12 12M18 6L6 18', trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
  expand: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', full: 'M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3',
  vol: 'M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14', mute: 'M11 5L6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6'
};
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', ICONS[name]); s.appendChild(p); return s;
}
function put(target, name) { target.textContent = ''; target.appendChild(icon(name)); }
$$('.ic').forEach((n) => put(n, n.dataset.i));
put($('#plusIcon'), 'plus'); put($('#soundIcon'), 'mute');

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const st = { cams: [], alerts: [], sys: null, sev: 'all', cam: 'all', cols: store.get('vl_cols', 'auto'), refs: {}, camSig: '', alertSig: '', camOpts: '' };

/* ---------- helpers ---------- */
function toast(msg, kind) {
  const t = el('div', 'toast ' + (kind || ''), msg); $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
function lvClass(c) { return c.loading || !c.online ? 'c-off' : 'c-' + c.level.toLowerCase(); }
function lvText(c) { return c.loading ? 'LOADING' : (!c.online ? 'OFFLINE' : c.level); }
function pretty(t) { return t.replace(/_/g, ' '); }
let lastFocus = null;
function openModal(m) { lastFocus = document.activeElement; m.hidden = false; const f = $('input,button.type,button', m); if (f) f.focus(); }
function closeModal(m) { m.hidden = true; if (m.id === 'focusModal') $('#focusView').textContent = ''; if (m.id === 'incModal') $('#incBody').textContent = ''; if (lastFocus) lastFocus.focus(); }
$$('.modal').forEach((m) => {
  m.addEventListener('click', (e) => { if (e.target === m || e.target.closest('[data-close]')) closeModal(m); });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $$('.modal').forEach((m) => { if (!m.hidden) closeModal(m); }); });

/* ---------- sound + alarm ---------- */
let soundOn = false, audioCtx = null, siren = null, sirenTimer = null, activeAlert = null;
$('#soundBtn').onclick = () => {
  soundOn = !soundOn;
  if (soundOn) { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); toast('Alarm sound enabled', 'ok'); }
  else stopSiren();
  $('#soundBtn').classList.toggle('on', soundOn); $('#soundBtn').setAttribute('aria-pressed', soundOn);
  $('#soundLbl').textContent = soundOn ? 'Sound on' : 'Sound off'; put($('#soundIcon'), soundOn ? 'vol' : 'mute');
};
function startSiren() {
  if (!soundOn || siren) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; g.gain.value = 0.12; o.connect(g); g.connect(audioCtx.destination); o.start();
  let hi = false; const t = setInterval(() => { hi = !hi; o.frequency.setValueAtTime(hi ? 900 : 600, audioCtx.currentTime); }, 450);
  siren = { o, t }; sirenTimer = setTimeout(stopSiren, 25000);
}
function stopSiren() {
  clearTimeout(sirenTimer); if (!siren) return;
  clearInterval(siren.t); siren.o.stop(); siren = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function triggerAlarm(a) {
  activeAlert = a;
  $('#alType').textContent = pretty(a.type); $('#alMsg').textContent = a.message; $('#alWhy').textContent = (a.reasons || []).join(' / ');
  const img = $('#alImg'); if (a.snapshot) { img.src = '/evidence/' + encodeURIComponent(a.snapshot); img.hidden = false; } else img.hidden = true;
  $('#alarm').hidden = false; $('#alAck').focus(); startSiren();
  if (soundOn && 'speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('Alert. ' + pretty(a.type).toLowerCase() + ' at ' + pretty(a.camera))); }
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}
async function ack(id) {
  try { await fetch('/api/alerts/' + id + '/ack', { method: 'POST' }); } catch (e) { toast('Could not reach the server', 'err'); return; }
  stopSiren(); $('#alarm').hidden = true; pollAlerts();
}
$('#alAck').onclick = () => { if (activeAlert) ack(activeAlert.id); else { stopSiren(); $('#alarm').hidden = true; } };
$('#alView').onclick = () => { stopSiren(); $('#alarm').hidden = true; if (activeAlert) openIncident(activeAlert.id); };
$('#testBtn').onclick = async () => { await fetch('/api/test_alert', { method: 'POST' }); pollAlerts(); toast('Test alert sent through all configured channels'); };
$('#ackAll').onclick = async () => {
  const open = st.alerts.filter((a) => !a.acked && a.severity !== 'WARNING');
  if (!open.length) return toast('Nothing to acknowledge');
  await Promise.all(open.map((a) => fetch('/api/alerts/' + a.id + '/ack', { method: 'POST' })));
  stopSiren(); pollAlerts(); toast(open.length + ' alert(s) acknowledged', 'ok');
};

/* ---------- cameras ---------- */
function buildCam(c, i) {
  const card = el('article', 'cam');
  const head = el('div', 'cam-head');
  const name = el('div', 'cam-name', c.name); name.title = c.name;
  const kind = el('span', 'cam-kind', c.kind === 'usb' ? 'USB' : 'NET');
  const chip = el('span', 'chip c-off', 'LOADING');
  head.append(name, kind, el('span', 'sp'), chip);
  const view = el('div', 'view');
  const img = el('img'); img.src = '/video_feed/' + encodeURIComponent(c.name); img.alt = 'Live feed from ' + c.name;
  const veil = el('div', 'veil'); veil.append(el('div', 'spinner'), el('span', '', 'Starting...'));
  const tools = el('div', 'tools');
  const mk = (cls, ic, label, fn) => { const b = el('button', 'tool ' + cls); b.setAttribute('aria-label', label); b.title = label; b.appendChild(icon(ic)); b.onclick = fn; return b; };
  tools.append(
    mk('', 'expand', 'Focus view', () => openFocus(c.name)),
    mk('', 'full', 'Fullscreen', () => { if (img.requestFullscreen) img.requestFullscreen(); }),
    mk('rm', 'trash', 'Remove camera', async () => {
      if (!confirm('Remove camera ' + c.name + '?')) return;
      await fetch('/api/cameras/' + encodeURIComponent(c.name), { method: 'DELETE' }); toast('Removed ' + c.name); pollCameras();
    }));
  view.append(img, veil, tools);
  const foot = el('div', 'cam-foot');
  const meter = el('div', 'meter'); const fill = el('i'); meter.appendChild(fill);
  const m1 = el('b'), m2 = el('b'); meter.append(m1, m2);
  const facts = el('div', 'facts');
  foot.append(meter, facts);
  card.append(head, view, foot);
  st.refs[c.name] = { card, chip, veil, veilText: veil.lastChild, fill, m1, m2, facts };
  return card;
}
function fact(label, value, bad) { const f = el('span', 'fact' + (bad ? ' bad' : '')); f.append(document.createTextNode(label + ' '), el('strong', '', value)); return f; }
function updateCam(c) {
  const r = st.refs[c.name]; if (!r) return;
  r.chip.className = 'chip ' + lvClass(c); r.chip.textContent = lvText(c);
  r.card.classList.toggle('lv-threat', c.online && c.level === 'THREAT');
  r.card.classList.toggle('lv-warning', c.online && c.level === 'WARNING');
  r.veil.hidden = c.online && !c.loading;
  r.veilText.textContent = c.error ? c.error : (c.loading ? 'Loading AI models...' : 'Camera offline - retrying');
  r.veil.firstChild.hidden = !!c.error;
  const th = st.sys ? st.sys.thresholds : { warning: 0.35, threat: 0.6 };
  r.m1.style.left = (th.warning * 100) + '%'; r.m2.style.left = (th.threat * 100) + '%';
  r.fill.style.width = Math.round(c.score * 100) + '%';
  r.fill.style.background = c.score >= th.threat ? 'var(--danger)' : c.score >= th.warning ? 'var(--warn)' : 'var(--ok)';
  const a = c.audio;
  const audio = !a.enabled ? 'off' : (a.error ? 'error' : a.last);
  r.facts.textContent = '';
  r.facts.append(fact('threat', Math.round(c.score * 100) + '%'), fact('people', String(c.people)),
    fact('cam', c.cam_fps.toFixed(0) + ' fps'), fact('AI', c.fps.toFixed(1) + ' fps'), fact('audio', audio, a.error));
}
async function pollCameras() {
  try {
    const res = await fetch('/api/cameras'); const list = await res.json(); st.cams = list; setOnline(true);
    const sig = list.map((c) => c.name).join('|'); const grid = $('#grid');
    if (sig !== st.camSig) {
      st.camSig = sig; st.refs = {}; grid.textContent = '';
      if (!list.length) {
        const e = el('div', 'empty-cams'); e.append(el('strong', '', 'NO CAMERAS CONNECTED'), el('span', '', 'Add a USB webcam, a phone running an IP camera app, or an RTSP stream.'));
        const b = el('button', 'btn primary', 'Add your first camera'); b.onclick = openAdd; e.appendChild(b); grid.appendChild(e);
      }
      list.forEach((c, i) => grid.appendChild(buildCam(c, i)));
      updateCamFilter();
    }
    list.forEach(updateCam); renderStats();
    if (!$('#focusModal').hidden) updateFocus();
  } catch (e) { setOnline(false); }
}
function setOnline(ok) { $('#banner').hidden = ok; }
function updateCamFilter() {
  const names = st.cams.map((c) => c.name); const sig = names.join('|'); if (sig === st.camOpts) return; st.camOpts = sig;
  const sel = $('#camFilter'); sel.textContent = ''; const all = el('option', '', 'All cameras'); all.value = 'all'; sel.appendChild(all);
  names.forEach((n) => { const o = el('option', '', n); o.value = n; sel.appendChild(o); });
  if (!names.includes(st.cam)) st.cam = 'all'; sel.value = st.cam;
}
$('#camFilter').onchange = (e) => { st.cam = e.target.value; st.alertSig = ''; renderAlerts(); };

/* layout toggle */
function applyCols() {
  const g = $('#grid'); g.classList.toggle('auto', st.cols === 'auto'); g.style.setProperty('--cols', st.cols === 'auto' ? '' : st.cols);
  $$('.seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.cols === st.cols));
}
$$('.seg button').forEach((b) => b.onclick = () => { st.cols = b.dataset.cols; store.set('vl_cols', st.cols); applyCols(); });
applyCols();

/* focus modal */
let focusName = null;
function openFocus(name) {
  focusName = name; const c = st.cams.find((x) => x.name === name); if (!c) return;
  $('#focusTitle').textContent = name;
  const v = $('#focusView'); v.textContent = '';
  const img = el('img'); img.src = '/video_feed/' + encodeURIComponent(name); img.alt = 'Live feed from ' + name; v.appendChild(img);
  openModal($('#focusModal')); updateFocus();
}
function updateFocus() {
  const c = st.cams.find((x) => x.name === focusName); const side = $('#focusSide'); if (!c) return;
  side.textContent = '';
  const kv = (k, v) => { const d = el('div', 'kv'); d.append(el('span', '', k), el('b', '', v)); return d; };
  const chip = el('span', 'chip ' + lvClass(c), lvText(c));
  side.append(chip, kv('Source', c.source + (c.kind === 'usb' ? ' (USB)' : '')), kv('Threat score', Math.round(c.score * 100) + '%'),
    kv('People in view', String(c.people)), kv('Camera / AI rate', c.cam_fps.toFixed(0) + ' / ' + c.fps.toFixed(1) + ' fps'),
    kv('Audio', c.audio.enabled ? (c.audio.backend === 'yamnet' ? 'YAMNet: ' : 'Basic: ') + c.audio.last : 'Off'));
  if (c.error) side.appendChild(kv('Error', c.error));
}

/* ---------- alerts ---------- */
function visibleAlerts() {
  return st.alerts.filter((a) => {
    if (st.cam !== 'all' && a.camera !== st.cam) return false;
    if (st.sev === 'open') return !a.acked && a.severity !== 'WARNING';
    if (st.sev === 'CRITICAL' || st.sev === 'HIGH') return a.severity === st.sev;
    return true;
  });
}
function buildAlert(a) {
  const card = el('article', 'alert ' + a.severity + (a.acked ? ' acked' : ''));
  const top = el('div', 'a-top'); top.append(el('span', 'a-type', pretty(a.type)), el('span', 'a-time', a.time));
  card.append(top, el('div', 'a-msg', a.message));
  card.appendChild(el('div', 'a-meta', a.camera + ' / ' + a.service + ' / ' + Math.round(a.score * 100) + '% confidence'));
  const row = el('div', 'a-row');
  if (a.snapshot) {
    const t = el('button', 'thumb'); t.setAttribute('aria-label', 'Open incident details'); const im = el('img'); im.src = '/evidence/' + encodeURIComponent(a.snapshot); im.alt = 'Snapshot'; im.loading = 'lazy';
    t.appendChild(im); t.onclick = () => openIncident(a.id); row.appendChild(t);
  }
  const side = el('div', ''); side.style.cssText = 'display:grid;gap:6px;justify-items:start';
  const tags = el('div', 'a-row'); tags.append(el('span', 'tag sev-' + a.severity, a.severity));
  if (a.clip) tags.appendChild(el('span', 'tag', 'clip saved')); if (a.acked) tags.appendChild(el('span', 'tag', 'acknowledged'));
  side.appendChild(tags);
  const btns = el('div', 'a-row'); const d = el('button', 'btn small', 'Details'); d.onclick = () => openIncident(a.id); btns.appendChild(d);
  if (!a.acked && a.severity !== 'WARNING') { const b = el('button', 'btn small', 'Acknowledge'); b.onclick = () => ack(a.id); btns.appendChild(b); }
  side.appendChild(btns); row.appendChild(side); card.appendChild(row);
  return card;
}
function renderAlerts() {
  const list = visibleAlerts();
  const sig = st.sev + '|' + st.cam + '|' + list.map((a) => a.id + ':' + a.acked + ':' + (a.clip ? 1 : 0)).join(',');
  if (sig === st.alertSig) return; st.alertSig = sig;
  const feed = $('#feed'); feed.textContent = '';
  if (!list.length) feed.appendChild(el('div', 'empty', st.alerts.length ? 'No incidents match this filter.' : '> All clear. Awaiting threats...'));
  list.forEach((a) => feed.appendChild(buildAlert(a)));
  $('#logCount').textContent = list.length + ' shown';
}
$$('.pill').forEach((p) => p.onclick = () => { st.sev = p.dataset.sev; $$('.pill').forEach((q) => q.setAttribute('aria-pressed', q === p)); renderAlerts(); });
let lastSeen = 0, firstAlertLoad = true;
async function pollAlerts() {
  try {
    const list = await (await fetch('/api/alerts')).json(); st.alerts = list; setOnline(true);
    const maxId = list.reduce((m, a) => Math.max(m, a.id), 0);
    if (firstAlertLoad) { lastSeen = maxId; firstAlertLoad = false; }
    else list.filter((a) => a.id > lastSeen).sort((x, y) => x.id - y.id).forEach((a) => { if (a.severity === 'HIGH' || a.severity === 'CRITICAL') triggerAlarm(a); });
    lastSeen = Math.max(lastSeen, maxId); renderAlerts(); renderStats();
    if (!$('#incModal').hidden && incId) openIncident(incId, true);
  } catch (e) { setOnline(false); }
}
let incId = null;
function openIncident(id, refreshOnly) {
  const a = st.alerts.find((x) => x.id === id); if (!a) return;
  incId = id; const body = $('#incBody');
  if (refreshOnly && body.dataset.clip === String(!!a.clip) && body.dataset.acked === String(a.acked)) return;
  body.dataset.clip = String(!!a.clip); body.dataset.acked = String(a.acked); body.textContent = '';
  $('#incTitle').textContent = pretty(a.type);
  if (a.clip) {
    const v = el('video'); v.controls = true; v.preload = 'metadata'; v.src = '/evidence/' + encodeURIComponent(a.clip); if (a.snapshot) v.poster = '/evidence/' + encodeURIComponent(a.snapshot); body.appendChild(v);
    const dl = el('a', 'btn small', 'Download clip'); dl.href = v.src; dl.download = a.clip; dl.style.justifySelf = 'start'; body.appendChild(dl);
  } else if (a.snapshot) { const im = el('img'); im.src = '/evidence/' + encodeURIComponent(a.snapshot); im.alt = 'Incident snapshot'; body.appendChild(im); }
  body.appendChild(el('div', 'a-msg', a.message));
  const tags = el('div', 'reasons'); tags.append(el('span', 'tag sev-' + a.severity, a.severity), el('span', 'tag', a.camera), el('span', 'tag', 'dispatch: ' + a.service), el('span', 'tag', a.time), el('span', 'tag', Math.round(a.score * 100) + '% confidence'));
  body.appendChild(tags);
  if (a.reasons && a.reasons.length) { const r = el('div', 'reasons'); a.reasons.forEach((x) => r.appendChild(el('span', 'tag', x))); body.appendChild(r); }
  if (!a.acked && a.severity !== 'WARNING') { const b = el('button', 'btn danger', 'Acknowledge incident'); b.style.justifySelf = 'start'; b.onclick = async () => { await ack(a.id); closeModal($('#incModal')); }; body.appendChild(b); }
  if (!refreshOnly) openModal($('#incModal'));
}

/* ---------- stats + title ---------- */
function renderStats() {
  const online = st.cams.filter((c) => c.online && !c.loading).length;
  const threats = st.cams.filter((c) => c.online && c.level === 'THREAT').length;
  const open = st.alerts.filter((a) => !a.acked && a.severity !== 'WARNING').length;
  $('#statCams').textContent = online + '/' + st.cams.length; $('#statThreat').textContent = threats; $('#statOpen').textContent = open;
  $('#stThreat').classList.toggle('hot', threats > 0); $('#stOpen').classList.toggle('amber', open > 0);
  $('#camCount').textContent = st.cams.length ? st.cams.length + ' connected' : '';
  document.title = (threats ? '[ALERT] ' : (open ? '(' + open + ') ' : '')) + 'VigiLight Command Center';
}

/* ---------- add camera ---------- */
const TYPES = {
  usb: { ph: '0', hint: 'USB camera number. Use Scan USB to find free ones.', audio: 'mic' },
  ip: { ph: '192.168.1.20:8080', hint: 'Just the address shown in your camera app. /video and /audio.wav are added for you.', audio: 'auto' },
  rtsp: { ph: 'rtsp://user:password@192.168.1.30/stream', hint: 'Full RTSP URL from your camera manual.', audio: 'off' },
  file: { ph: 'C:/clips/staged_attack.mp4', hint: 'Path to a video file on the computer running VigiLight. It loops, which is handy for demos.', audio: 'off' }
};
let addType = 'ip';
function setType(t) {
  addType = t; $$('#types .type').forEach((b) => b.setAttribute('aria-pressed', b.dataset.type === t));
  $('#addValue').placeholder = TYPES[t].ph; $('#addAudio').value = TYPES[t].audio; $('#usbBox').hidden = t !== 'usb';
  setHint(TYPES[t].hint);
}
function setHint(msg, err) { const h = $('#addHint'); h.textContent = msg; h.className = 'hint' + (err ? ' err' : ''); }
$$('#types .type').forEach((b) => b.onclick = () => setType(b.dataset.type));
function openAdd() { setType(addType); $('#addValue').value = ''; $('#addName').value = ''; openModal($('#addModal')); }
$('#addOpen').onclick = openAdd;
$('#addBtn').onclick = async () => {
  const btn = $('#addBtn'); const value = $('#addValue').value.trim();
  if (!value) return setHint('Enter the camera source first.', true);
  btn.disabled = true;
  try {
    const res = await fetch('/api/cameras', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: addType, value, name: $('#addName').value, audio: $('#addAudio').value }) });
    const data = await res.json();
    if (!res.ok) return setHint(data.error || 'Could not add the camera.', true);
    closeModal($('#addModal')); toast('Added ' + data.name + '. The first start loads the AI models, so give it a few seconds.', 'ok'); pollCameras();
  } catch (e) { setHint('Could not reach the server.', true); } finally { btn.disabled = false; }
};
$('#addValue').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#addBtn').click(); });
$('#scanBtn').onclick = async () => {
  setType('usb'); setHint('Scanning USB ports...'); const list = $('#usbList'); list.textContent = '';
  try {
    const d = await (await fetch('/api/usb_scan')).json();
    d.available.forEach((i) => { const b = el('button', 'btn small', 'USB camera ' + i); b.onclick = () => { $('#addValue').value = String(i); }; list.appendChild(b); });
    setHint(d.available.length ? 'Found ' + d.available.length + ' free USB camera(s). Click one to use it.' : 'No free USB cameras found' + (d.in_use.length ? ' (already in use: ' + d.in_use.join(', ') + ')' : '') + '.', !d.available.length);
  } catch (e) { setHint('Scan failed. Is the server running?', true); }
};

/* ---------- footer ---------- */
async function loadSystem() {
  try {
    const s = await (await fetch('/api/system')).json(); st.sys = s;
    const box = $('#channels'); box.textContent = '';
    Object.keys(s.channels).forEach((k) => box.appendChild(el('span', 'ch' + (s.channels[k] ? ' on' : ''), k)));
    $('#thresholds').textContent = 'WARNING AT ' + Math.round(s.thresholds.warning * 100) + '%  /  ALERT AT ' + Math.round(s.thresholds.threat * 100) + '%';
  } catch (e) { /* retried below */ }
}

loadSystem(); pollCameras(); pollAlerts();
setInterval(pollCameras, 1000); setInterval(pollAlerts, 1000); setInterval(loadSystem, 30000);
</script>
