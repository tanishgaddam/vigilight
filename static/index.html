<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigiLight Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#111520;--accent:#00e5ff;--danger:#ff2a2a;--warning:#ffb800;--ok:#3ddc84;--text:#e0e6ed;--muted:#8892b0;--border:rgba(0,229,255,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg) radial-gradient(circle at 50% 0%,#111827 0%,#000 70%);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;display:flex;flex-direction:column;padding:16px 20px 28px}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
.title{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:700;color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,.4);letter-spacing:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--border);color:var(--accent);padding:6px 14px;border-radius:4px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:13px}
.btn:hover{background:rgba(0,229,255,.1)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn.warn{border-color:var(--warning);color:var(--warning)}
.badge{border:1px solid var(--danger);color:var(--danger);padding:6px 14px;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:13px;background:rgba(255,42,42,.08)}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px;flex:1;min-height:0}
@media(max-width:980px){.layout{grid-template-columns:1fr}body{overflow:auto}}
.left{overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:16px}
.camera-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-content:start}
.cam-card{background:var(--panel);border:1px solid var(--border);border-radius:4px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cam-card.threat{border-color:var(--danger);box-shadow:0 0 18px rgba(255,42,42,.5)}
.cam-card.warning{border-color:var(--warning)}
.cam-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:13px;background:rgba(0,0,0,.35)}
.cam-view{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.chip{padding:2px 10px;border-radius:3px;font-size:12px;border:1px solid currentColor}
.lv-normal{color:var(--ok)}.lv-watch{color:#ffd700}.lv-warning{color:var(--warning)}.lv-threat{color:var(--danger);animation:blink 1s infinite}.lv-offline{color:var(--muted)}
@keyframes blink{50%{opacity:.35}}
.cam-foot{padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);display:grid;gap:6px}
.bar{height:5px;background:#1b2233;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s,background .4s}
.rm{position:absolute;top:6px;right:96px;background:rgba(0,0,0,.6);border:1px solid var(--border);color:var(--muted);border-radius:3px;cursor:pointer;font-size:12px;padding:1px 7px}
.rm:hover{color:var(--danger);border-color:var(--danger)}
.add{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:14px}
.add h2,.sidebar h2{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:1px;color:var(--accent);margin-bottom:10px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{background:#0a0e17;border:1px solid var(--border);border-radius:4px;padding:7px 10px;min-width:150px}
.field.grow{flex:1;min-width:220px}
.note{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.note.err{color:var(--danger)}
.usb-found{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sidebar{background:var(--panel);border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column;min-height:0;max-height:100%}
.sidebar h2{padding:14px 14px 0}
.feed{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.alert{border-left:4px solid var(--warning);background:rgba(0,0,0,.4);padding:10px;border-radius:4px;font-size:14px;display:grid;gap:6px}
.alert.CRITICAL{border-left-color:var(--danger)}.alert.WARNING{border-left-color:#555}
.alert.acked{opacity:.55}
.a-head{display:flex;justify-content:space-between;gap:8px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted)}
.a-type{color:var(--text);font-weight:700}
.a-msg{font-size:15px}
.a-why{font-size:13px;color:var(--muted)}
.a-media{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a-media img{width:120px;border-radius:3px;border:1px solid var(--border);display:block}
.a-media a{color:var(--accent);font-size:13px}
.empty{color:#556;font-family:'Share Tech Mono',monospace;font-size:13px}
.footer{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--border);padding:5px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:'Share Tech Mono',monospace;font-size:11px;color:#667;z-index:50}
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(90,0,0,.88);animation:flash .9s infinite}
@keyframes flash{50%{background:rgba(160,0,0,.92)}}
@media(prefers-reduced-motion:reduce){.overlay{animation:none}.lv-threat{animation:none}}
.ov-box{background:#140607;border:2px solid var(--danger);border-radius:6px;padding:26px 30px;max-width:640px;width:calc(100% - 32px);text-align:center;display:grid;gap:12px}
.ov-type{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:700;color:#fff}
.ov-msg{font-size:20px}
.ov-why{font-size:15px;color:#ffb3b3}
.ov-box img{max-width:100%;border-radius:4px;border:1px solid var(--danger)}
.ov-box .btn{border-color:#fff;color:#fff;font-size:16px;padding:10px 18px}
</style>
</head>
<body>
<header>
  <div class="title">VIGILIGHT // COMMAND CENTER</div>
  <div class="tools">
    <button class="btn" id="soundBtn">Sound off - click to enable</button>
    <button class="btn warn" id="testBtn">Send test alert</button>
    <div class="badge">SYSTEM ARMED</div>
  </div>
</header>

<div class="layout">
  <div class="left">
    <div class="camera-grid" id="grid"></div>
    <div class="add">
      <h2>Add camera</h2>
      <div class="row">
        <label class="field">Type
          <select id="addType">
            <option value="usb">USB webcam</option>
            <option value="ip" selected>IP camera / phone app</option>
            <option value="rtsp">RTSP stream</option>
            <option value="file">Video file (demo)</option>
          </select>
        </label>
        <label class="field grow">Source
          <input id="addValue" placeholder="192.168.1.20:8080" autocomplete="off">
        </label>
        <label class="field">Name (optional)
          <input id="addName" placeholder="main_streetlight" autocomplete="off">
        </label>
        <label class="field">Audio
          <select id="addAudio">
            <option value="auto">Auto (IP camera microphone)</option>
            <option value="mic">Local microphone</option>
            <option value="off">Off</option>
          </select>
        </label>
        <button class="btn" id="addBtn">Add camera</button>
        <button class="btn" id="scanBtn">Scan USB</button>
      </div>
      <div class="usb-found" id="usbFound"></div>
      <div class="note" id="addNote"></div>
    </div>
  </div>

  <aside class="sidebar">
    <h2>Incident log</h2>
    <div class="feed" id="log"></div>
  </aside>
</div>

<div class="footer"><span id="channels">Alert channels: loading</span><span id="thresholds"></span></div>

<div class="overlay" id="overlay" role="alertdialog" aria-live="assertive">
  <div class="ov-box">
    <div class="ov-type" id="ovType"></div>
    <div class="ov-msg" id="ovMsg"></div>
    <div class="ov-why" id="ovWhy"></div>
    <img id="ovImg" alt="Snapshot of the incident" hidden>
    <button class="btn" id="ovAck">Acknowledge and silence</button>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

let camSig = '', alertSig = '', lastSeen = 0, firstLoad = true;
let soundOn = false, audioCtx = null, siren = null, sirenStop = null, activeAlert = null;

/* ---------- sound ---------- */
$('#soundBtn').onclick = () => {
  soundOn = !soundOn;
  if (soundOn) {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } else stopSiren();
  $('#soundBtn').textContent = soundOn ? 'Sound on' : 'Sound off - click to enable';
  $('#soundBtn').classList.toggle('on', soundOn);
};
function startSiren() {
  if (!soundOn || siren) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; g.gain.value = 0.12; o.connect(g); g.connect(audioCtx.destination); o.start();
  let hi = false;
  const t = setInterval(() => { hi = !hi; o.frequency.setValueAtTime(hi ? 900 : 600, audioCtx.currentTime); }, 450);
  siren = { o, t };
  sirenStop = setTimeout(stopSiren, 25000);
}
function stopSiren() {
  clearTimeout(sirenStop);
  if (!siren) return;
  clearInterval(siren.t); siren.o.stop(); siren = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function speak(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

/* ---------- alarm overlay ---------- */
function triggerAlarm(a) {
  activeAlert = a;
  $('#ovType').textContent = a.type.replace(/_/g, ' ');
  $('#ovMsg').textContent = a.message;
  $('#ovWhy').textContent = (a.reasons || []).join(' / ');
  const img = $('#ovImg');
  if (a.snapshot) { img.src = '/evidence/' + encodeURIComponent(a.snapshot); img.hidden = false; } else img.hidden = true;
  $('#overlay').style.display = 'flex';
  startSiren();
  speak('Alert. ' + a.type.replace(/_/g, ' ').toLowerCase() + ' at ' + a.camera.replace(/_/g, ' '));
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}
async function ack(id) {
  await fetch('/api/alerts/' + id + '/ack', { method: 'POST' });
  stopSiren();
  $('#overlay').style.display = 'none';
  pollAlerts();
}
$('#ovAck').onclick = () => { if (activeAlert) ack(activeAlert.id); else { stopSiren(); $('#overlay').style.display = 'none'; } };
$('#testBtn').onclick = async () => { await fetch('/api/test_alert', { method: 'POST' }); pollAlerts(); };

/* ---------- cameras ---------- */
function buildCam(c, i) {
  const card = el('div', 'cam-card'); card.id = 'cam-' + c.name;
  const head = el('div', 'cam-header');
  head.appendChild(el('span', '', '[CAM_' + String(i + 1).padStart(2, '0') + '] ' + c.name));
  const chip = el('span', 'chip lv-normal', 'NORMAL'); chip.id = 'chip-' + c.name; head.appendChild(chip);
  const img = el('img', 'cam-view'); img.src = '/video_feed/' + encodeURIComponent(c.name); img.alt = 'Live feed from ' + c.name;
  const rm = el('button', 'rm', 'remove'); rm.title = 'Remove camera';
  rm.onclick = async () => { if (confirm('Remove camera ' + c.name + '?')) { await fetch('/api/cameras/' + encodeURIComponent(c.name), { method: 'DELETE' }); refresh(); } };
  const foot = el('div', 'cam-foot');
  const bar = el('div', 'bar'); const fill = el('i'); fill.id = 'bar-' + c.name; bar.appendChild(fill);
  const meta = el('div', '', ''); meta.id = 'meta-' + c.name;
  foot.append(bar, meta);
  card.append(head, img, rm, foot);
  return card;
}
function updateCam(c) {
  const chip = $('#chip-' + c.name); if (!chip) return;
  const state = c.loading ? 'LOADING' : (!c.online ? 'OFFLINE' : c.level);
  chip.textContent = state;
  chip.className = 'chip ' + (state === 'LOADING' || state === 'OFFLINE' ? 'lv-offline' : 'lv-' + c.level.toLowerCase());
  const card = $('#cam-' + c.name);
  card.classList.toggle('threat', c.level === 'THREAT' && c.online);
  card.classList.toggle('warning', c.level === 'WARNING' && c.online);
  const fill = $('#bar-' + c.name);
  fill.style.width = Math.round(c.score * 100) + '%';
  fill.style.background = c.score >= 0.6 ? 'var(--danger)' : c.score >= 0.35 ? 'var(--warning)' : 'var(--ok)';
  let audio = c.audio.enabled ? ('audio ' + c.audio.last + (c.audio.backend === 'loudness' ? ' (basic)' : '')) : 'audio off';
  if (c.audio.error) audio = 'audio error';
  $('#meta-' + c.name).textContent = c.people + ' people / ' + c.fps.toFixed(1) + ' fps / ' + audio + (c.error ? ' / ' + c.error : '');
}
async function pollCameras() {
  try {
    const list = await (await fetch('/api/cameras')).json();
    const sig = list.map((c) => c.name).join('|');
    const grid = $('#grid');
    if (sig !== camSig) {
      camSig = sig; grid.textContent = '';
      if (!list.length) grid.appendChild(el('div', 'empty', '> No cameras yet. Add a USB or IP camera below.'));
      list.forEach((c, i) => grid.appendChild(buildCam(c, i)));
    }
    list.forEach(updateCam);
  } catch (e) { /* server restarting */ }
}
function refresh() { pollCameras(); pollAlerts(); }

/* ---------- alerts ---------- */
function buildAlert(a) {
  const card = el('div', 'alert ' + a.severity + (a.acked ? ' acked' : ''));
  const head = el('div', 'a-head');
  head.appendChild(el('span', 'a-type', a.type.replace(/_/g, ' ') + ' (' + a.severity + ')'));
  head.appendChild(el('span', '', a.time));
  card.appendChild(head);
  card.appendChild(el('div', 'a-msg', a.message));
  card.appendChild(el('div', 'a-why', '[' + a.service + '] ' + a.camera + ' / confidence ' + Math.round(a.score * 100) + '%' + (a.reasons && a.reasons.length ? ' / ' + a.reasons.join(', ') : '')));
  const media = el('div', 'a-media');
  if (a.snapshot) {
    const link = el('a'); link.href = '/evidence/' + encodeURIComponent(a.snapshot); link.target = '_blank';
    const img = el('img'); img.src = link.href; img.alt = 'Snapshot'; link.appendChild(img); media.appendChild(link);
  }
  if (a.clip) { const l = el('a', '', 'Download clip'); l.href = '/evidence/' + encodeURIComponent(a.clip); l.target = '_blank'; media.appendChild(l); }
  if (!a.acked && a.severity !== 'WARNING') { const b = el('button', 'btn', 'Acknowledge'); b.onclick = () => ack(a.id); media.appendChild(b); }
  if (media.childNodes.length) card.appendChild(media);
  return card;
}
async function pollAlerts() {
  try {
    const list = await (await fetch('/api/alerts')).json();
    const maxId = list.reduce((m, a) => Math.max(m, a.id), 0);
    if (firstLoad) { lastSeen = maxId; firstLoad = false; }
    else list.filter((a) => a.id > lastSeen).sort((x, y) => x.id - y.id).forEach((a) => {
      if (a.severity === 'HIGH' || a.severity === 'CRITICAL') triggerAlarm(a);
    });
    lastSeen = Math.max(lastSeen, maxId);
    const sig = list.map((a) => a.id + ':' + a.acked + ':' + (a.clip ? 1 : 0)).join('|');
    if (sig !== alertSig) {
      alertSig = sig;
      const feed = $('#log'); feed.textContent = '';
      if (!list.length) feed.appendChild(el('div', 'empty', '> Awaiting threats...'));
      list.forEach((a) => feed.appendChild(buildAlert(a)));
    }
  } catch (e) { /* server restarting */ }
}

/* ---------- add camera ---------- */
const hints = { usb: '0', ip: '192.168.1.20:8080', rtsp: 'rtsp://user:password@192.168.1.30/stream', file: 'C:/clips/staged_attack.mp4' };
$('#addType').onchange = () => {
  const t = $('#addType').value;
  $('#addValue').placeholder = hints[t];
  $('#addAudio').value = t === 'ip' ? 'auto' : (t === 'usb' ? 'mic' : 'off');
};
function note(msg, err) { const n = $('#addNote'); n.textContent = msg; n.className = 'note' + (err ? ' err' : ''); }
$('#addBtn').onclick = async () => {
  const body = { type: $('#addType').value, value: $('#addValue').value, name: $('#addName').value, audio: $('#addAudio').value };
  const res = await fetch('/api/cameras', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) return note(data.error || 'Could not add camera.', true);
  note('Added ' + data.name + '. Models load on first start, so the feed can take a few seconds.');
  $('#addValue').value = ''; $('#addName').value = '';
  refresh();
};
$('#scanBtn').onclick = async () => {
  note('Scanning USB ports...');
  const box = $('#usbFound'); box.textContent = '';
  const data = await (await fetch('/api/usb_scan')).json();
  data.available.forEach((i) => {
    const b = el('button', 'btn', 'USB camera ' + i);
    b.onclick = () => { $('#addType').value = 'usb'; $('#addValue').value = String(i); $('#addAudio').value = 'mic'; };
    box.appendChild(b);
  });
  note(data.available.length ? 'Found ' + data.available.length + ' free USB camera(s). Click one to fill the form.' : 'No free USB cameras found' + (data.in_use.length ? ' (in use: ' + data.in_use.join(', ') + ')' : '') + '.', !data.available.length);
};

/* ---------- footer ---------- */
(async () => {
  try {
    const s = await (await fetch('/api/system')).json();
    const on = Object.keys(s.channels).filter((k) => s.channels[k]);
    $('#channels').textContent = 'Alert channels: ' + on.join(', ');
    $('#thresholds').textContent = 'warning at ' + s.thresholds.warning + ' / alert at ' + s.thresholds.threat;
  } catch (e) {}
})();

pollCameras(); pollAlerts();
setInterval(pollCameras, 1000);
setInterval(pollAlerts, 1000);
</script>
</body>
</html>
